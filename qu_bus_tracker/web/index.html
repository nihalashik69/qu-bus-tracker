<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Real-time Qatar University campus bus tracking.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="qu_bus_tracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>QU Bus Tracker</title>
  <link rel="manifest" href="manifest.json">
  <!--
    Google Maps JavaScript API.

    `__GOOGLE_MAPS_API_KEY__` is replaced by scripts/vercel-build.sh when the
    Vercel project has GOOGLE_MAPS_API_KEY set. If the placeholder survived
    (plain `flutter build web`, ZIP upload, GitHub Pages, ...) we must NOT
    request the API with a bogus key: the map would fail and every live-bus
    ETA popup would disappear. In that case the bundle injects the script
    itself from --dart-define=GOOGLE_MAPS_API_KEY (see
    lib/google_maps_web_loader.dart).
  -->
  <script>
    (function () {
      var key = "__GOOGLE_MAPS_API_KEY__";
      if (!key || key.indexOf("__") === 0) {
        // Placeholder not substituted - let the Flutter bundle load the API.
        return;
      }
      var script = document.createElement("script");
      script.src =
        "https://maps.googleapis.com/maps/api/js?key=" +
        encodeURIComponent(key);
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
